    let currentBatchFilter = 'ALL';
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const cardList = document.getElementById('cardList');
    const resultCount = document.getElementById('resultCount');

    function renderList(filteredData, searchTerms = []) {
      cardList.innerHTML = '';
      resultCount.textContent = `目前顯示：${filteredData.length} 筆`;

      if (filteredData.length === 0) {
        cardList.innerHTML = '<div class="empty-state">無符合條件的物料資料</div>';
        return;
      }

      const fragment = document.createDocumentFragment();

      filteredData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';

        // 簡化批次文字
        const shortBatch = item.batch.split(' ')[0];

        card.innerHTML = `
          <div class="card-top">
            <div class="badge-group">
              <span class="badge-batch">${shortBatch}</span>
              <span class="badge-id">項次 ${highlight(escapeHtml(item.id), searchTerms)}</span>
              ${item.name ? `<span class="badge-name">${highlight(escapeHtml(item.name), searchTerms)}</span>` : ''}
            </div>
            <div class="qty-display">
              <span class="qty-num">${item.qty}</span>
              <span class="qty-unit">件</span>
            </div>
          </div>
          <div class="spec-text">${highlight(escapeHtml(item.spec), searchTerms)}</div>
          <div class="meta-row">
            <span><strong>料表：</strong>${highlight(escapeHtml(item.sheet || '-'), searchTerms)}</span>
            <span><strong>批次日期：</strong>${item.batch.match(/\((.*?)\)/)?.[1] || ''}</span>
          </div>
          ${item.dwg ? `<div class="drawing-box">${highlight(escapeHtml(item.dwg), searchTerms)}</div>` : ''}
        `;
        fragment.appendChild(card);
      });

      cardList.appendChild(fragment);
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      clearBtn.style.display = query.length > 0 ? 'block' : 'none';
      const searchTerms = query ? query.split(/\s+/).filter(t => t.length > 0) : [];

      let result = items;

      // 批次過濾
      if (currentBatchFilter !== 'ALL') {
        result = result.filter(item => item.batch.includes(currentBatchFilter));
      }

      // 關鍵字過濾 (項次, 料表, 圖件號, 名稱, 規格)
      if (searchTerms.length > 0) {
        result = result.filter(item => {
          const combined = `${item.batch} ${item.id} ${item.sheet} ${item.dwg} ${item.name} ${item.spec}`.toLowerCase();
          return searchTerms.every(term => combined.includes(term));
        });
      }

      renderList(result, searchTerms);
    }

    function onSearchInput() {
      applyFilters();
    }

    function clearSearch() {
      searchInput.value = '';
      applyFilters();
      searchInput.focus();
    }

    function setBatchFilter(batch, btn) {
      currentBatchFilter = batch;
      document.querySelectorAll('.pill').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function highlight(text, terms) {
      if (!terms || terms.length === 0 || !text) return text;
      let patternStr = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      let regex = new RegExp(`(${patternStr})`, 'gi');
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    // 初始化顯示
    applyFilters();
  </script>
